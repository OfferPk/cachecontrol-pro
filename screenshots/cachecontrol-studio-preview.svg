<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#101522"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131929"/>
      <stop offset="100%" stop-color="#171f32"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="url(#bg)"/>

  <!-- Header -->
  <rect x="30" y="24" width="1140" height="72" rx="12" fill="#101522" stroke="#232d45"/>
  <rect x="50" y="38" width="44" height="44" rx="8" fill="url(#accentGrad)" filter="url(#glow)"/>
  <text x="72" y="66" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">CC</text>
  <text x="110" y="56" fill="#fff" font-weight="bold" font-size="18">CacheControl Pro <tspan fill="#06b6d4" font-size="12">v1.0.0</tspan></text>
  <text x="110" y="74" fill="#94a3b8" font-size="12">Enterprise HTTP Caching Architecture (RFC 9111), CDN Edge Strategy Studio &amp; PII Cache Leakage Auditor</text>

  <!-- Status Pill -->
  <rect x="880" y="42" width="270" height="36" rx="18" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981"/>
  <circle cx="900" cy="60" r="5" fill="#10b981"/>
  <text x="915" y="64" fill="#34d399" font-weight="bold" font-size="12" font-family="monospace">UNCACHED_SENSITIVE (0-Disk)</text>

  <!-- Left Column: Directive Matrix -->
  <rect x="30" y="116" width="555" height="380" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="50" y="146" fill="#fff" font-weight="bold" font-size="15">RFC 9111 Directive Configuration</text>
  <rect x="470" y="132" width="95" height="20" rx="10" fill="#232d45"/>
  <text x="517" y="146" fill="#06b6d4" font-size="10" font-weight="bold" text-anchor="middle">IETF RFC 9111</text>

  <!-- Visibility Row -->
  <text x="50" y="180" fill="#f1f5f9" font-weight="bold" font-size="13">Cache Visibility Scope</text>
  <rect x="50" y="192" width="515" height="36" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <rect x="52" y="194" width="168" height="32" rx="4" fill="#10b981"/>
  <text x="136" y="215" fill="#fff" font-weight="bold" font-size="12" text-anchor="middle" font-family="monospace">private</text>
  <text x="308" y="215" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">public</text>
  <text x="478" y="215" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="monospace">unspecified</text>

  <!-- Storage Toggles Grid -->
  <g transform="translate(50, 245)">
    <rect width="250" height="36" rx="4" fill="#101522" stroke="#232d45"/>
    <text x="15" y="23" fill="#fff" font-family="monospace" font-size="11">no-store [✓]</text>
    <rect x="265" width="250" height="36" rx="4" fill="#101522" stroke="#232d45"/>
    <text x="280" y="23" fill="#fff" font-family="monospace" font-size="11">no-cache [✓]</text>
  </g>
  <g transform="translate(50, 290)">
    <rect width="250" height="36" rx="4" fill="#101522" stroke="#232d45"/>
    <text x="15" y="23" fill="#fff" font-family="monospace" font-size="11">must-revalidate [✓]</text>
    <rect x="265" width="250" height="36" rx="4" fill="#101522" stroke="#232d45"/>
    <text x="280" y="23" fill="#94a3b8" font-family="monospace" font-size="11">proxy-revalidate [ ]</text>
  </g>

  <!-- Lifetimes & Companion -->
  <rect x="50" y="340" width="515" height="135" rx="6" fill="#101522" stroke="#232d45"/>
  <text x="65" y="365" fill="#38bdf8" font-weight="bold" font-size="11">COMPANION HEADERS &amp; VARY</text>
  <text x="65" y="390" fill="#fff" font-size="11" font-family="monospace">Vary: Authorization, Cookie, Accept-Encoding</text>
  <text x="65" y="415" fill="#fff" font-size="11" font-family="monospace">Surrogate-Control: no-store (CDN edge override)</text>
  <text x="65" y="445" fill="#10b981" font-size="11">✓ Complete zero-retention &bull; 0ms local disk write &bull; 0 CDN cache</text>

  <!-- Right Column: 10-Point Auditor -->
  <rect x="615" y="116" width="555" height="380" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="635" y="146" fill="#fff" font-weight="bold" font-size="15">10-Point PII Leakage &amp; Caching Auditor</text>
  <rect x="1055" y="132" width="95" height="20" rx="10" fill="#232d45"/>
  <text x="1102" y="146" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">SCORE: 100/100</text>

  <!-- Score Banner -->
  <rect x="635" y="165" width="515" height="68" rx="8" fill="#101522" stroke="#232d45"/>
  <circle cx="675" cy="199" r="26" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="2"/>
  <text x="675" y="206" fill="#10b981" font-weight="bold" font-size="18" text-anchor="middle">A+</text>
  <text x="715" y="190" fill="#fff" font-weight="bold" font-size="14">Zero-Retention Fortified Posture</text>
  <text x="715" y="208" fill="#94a3b8" font-size="11">No PII leakage surface. Responses completely prevented from intermediate caching.</text>

  <!-- Audit Items -->
  <g transform="translate(635, 245)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Authenticated Session &amp; PII Cache Leakage Defense</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (20/20)</text>
  </g>

  <g transform="translate(635, 290)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">The "no-cache" vs "no-store" Semantics Alignment</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (10/10)</text>
  </g>

  <g transform="translate(635, 335)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Shared Cache &amp; CDN Edge Boundary Scoping</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (15/15)</text>
  </g>

  <g transform="translate(635, 380)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Vary Header &amp; Cache Partitioning Integrity</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (10/10)</text>
  </g>

  <g transform="translate(635, 425)">
    <rect width="515" height="38" rx="4" fill="#101522" stroke="#232d45"/>
    <rect width="4" height="38" fill="#10b981"/>
    <text x="14" y="23" fill="#fff" font-size="12" font-weight="bold">Downstream Proxy &amp; Browser Revalidation</text>
    <rect x="420" y="8" width="80" height="20" rx="4" fill="rgba(16, 185, 129, 0.2)"/>
    <text x="460" y="22" fill="#34d399" font-size="10" font-weight="bold" font-family="monospace" text-anchor="middle">PASS (5/5)</text>
  </g>

  <!-- Bottom Panel: Synthesized Config -->
  <rect x="30" y="520" width="1140" height="240" rx="12" fill="url(#cardGrad)" stroke="#232d45"/>
  <text x="50" y="550" fill="#fff" font-weight="bold" font-size="15">Synthesized Multi-Server Directives (Nginx)</text>
  <rect x="45" y="565" width="1110" height="175" rx="6" fill="#0a0d14" stroke="#232d45"/>
  <text x="65" y="595" fill="#64748b" font-family="monospace" font-size="12"># CacheControl Pro - Nginx HTTP Caching Configuration (RFC 9111)</text>
  <text x="65" y="620" fill="#38bdf8" font-family="monospace" font-size="12">add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;</text>
  <text x="65" y="645" fill="#38bdf8" font-family="monospace" font-size="12">add_header Vary "Authorization, Cookie, Accept-Encoding" always;</text>
  <text x="65" y="670" fill="#38bdf8" font-family="monospace" font-size="12">add_header Surrogate-Control "no-store" always;</text>
  <text x="65" y="705" fill="#10b981" font-family="monospace" font-size="12"># Posture: UNCACHED_SENSITIVE &bull; 0 Bytes Retained &bull; Steam/ChatGPT Cache Poisoning Defended</text>
</svg>

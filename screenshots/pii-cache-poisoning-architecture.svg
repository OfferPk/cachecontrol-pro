<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121827"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="650" fill="url(#bg2)"/>

  <!-- Title -->
  <text x="500" y="45" fill="#fff" font-weight="bold" font-size="20" text-anchor="middle">Shared Cache PII Poisoning vs. Zero-Retention Defense</text>
  <text x="500" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Comparing Catastrophic CDN Cache Leaks (Steam/ChatGPT Glitch) vs. CacheControl Pro</text>

  <!-- Left: Vulnerable Architecture -->
  <rect x="40" y="100" width="440" height="500" rx="12" fill="#151b2b" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="40" y="100" width="440" height="40" rx="12" fill="rgba(239, 68, 68, 0.15)"/>
  <text x="260" y="126" fill="#f87171" font-weight="bold" font-size="14" text-anchor="middle">SHARED CACHE PII LEAK (VULNERABLE)</text>

  <rect x="60" y="160" width="400" height="260" rx="8" fill="#0d111c" stroke="#232d45"/>
  <text x="260" y="185" fill="#94a3b8" font-weight="bold" font-size="12" text-anchor="middle">Intermediate Shared CDN Edge PoP</text>

  <!-- Alice Flow -->
  <text x="80" y="220" fill="#60a5fa" font-weight="bold" font-size="11">1. User A (Alice):</text>
  <text x="80" y="240" fill="#94a3b8" font-size="10">GET /api/billing &rarr; Origin returns: Cache-Control: public, max-age=3600</text>
  <rect x="80" y="250" width="360" height="35" rx="4" fill="#2d151d" stroke="#ef4444"/>
  <text x="260" y="272" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">CDN CACHES ALICE'S PRIVATE BILLING DATA</text>

  <!-- Bob Flow -->
  <text x="80" y="315" fill="#f59e0b" font-weight="bold" font-size="11">2. User B (Bob):</text>
  <text x="80" y="335" fill="#94a3b8" font-size="10">GET /api/billing &rarr; CDN returns cached 200 OK (HIT)</text>
  <rect x="80" y="345" width="360" height="35" rx="4" fill="#2d151d" stroke="#ef4444"/>
  <text x="260" y="367" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">BOB SEES ALICE'S CREDIT CARD &amp; ADDRESS!</text>

  <rect x="60" y="440" width="400" height="140" rx="8" fill="#2d151d" stroke="#ef4444"/>
  <text x="80" y="465" fill="#f87171" font-weight="bold" font-size="12">Real-World Damage:</text>
  <text x="80" y="490" fill="#fca5a5" font-size="11">&bull; Massive GDPR, HIPAA, and PCI DSS compliance violation</text>
  <text x="80" y="510" fill="#fca5a5" font-size="11">&bull; Millions in regulatory fines &amp; mandatory public disclosure</text>
  <text x="80" y="530" fill="#fca5a5" font-size="11">&bull; "no-cache" fails to prevent disk extraction on shared kiosk</text>
  <text x="80" y="550" fill="#fca5a5" font-size="11">&bull; Cloudflare/Fastly default caching treats URLs without no-store as cacheable</text>

  <!-- Right: Fortified Architecture -->
  <rect x="520" y="100" width="440" height="500" rx="12" fill="#151b2b" stroke="#10b981" stroke-width="1.5"/>
  <rect x="520" y="100" width="440" height="40" rx="12" fill="rgba(16, 185, 129, 0.15)"/>
  <text x="740" y="126" fill="#34d399" font-weight="bold" font-size="14" text-anchor="middle">CACHECONTROL PRO ZERO-RETENTION</text>

  <rect x="540" y="160" width="400" height="260" rx="8" fill="#0d111c" stroke="#10b981"/>
  <text x="740" y="185" fill="#34d399" font-weight="bold" font-size="12" text-anchor="middle">Hardened Edge &amp; Origin Architecture</text>

  <!-- Fortified Flow -->
  <text x="560" y="220" fill="#38bdf8" font-weight="bold" font-size="11">Origin Policy Directives:</text>
  <text x="560" y="240" fill="#fff" font-family="monospace" font-size="10">Cache-Control: private, no-store, no-cache, must-revalidate</text>
  <text x="560" y="260" fill="#fff" font-family="monospace" font-size="10">Vary: Authorization, Cookie, Accept-Encoding</text>
  <text x="560" y="280" fill="#fff" font-family="monospace" font-size="10">Surrogate-Control: no-store</text>

  <rect x="560" y="300" width="360" height="45" rx="4" fill="#132621" stroke="#10b981"/>
  <text x="740" y="320" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">ZERO INTERMEDIATE STORAGE AT CDN</text>
  <text x="740" y="335" fill="#a7f3d0" font-size="10" text-anchor="middle">Responses passed directly to authenticated client stream</text>

  <rect x="560" y="355" width="360" height="45" rx="4" fill="#132621" stroke="#10b981"/>
  <text x="740" y="375" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">ZERO LOCAL DISK PERSISTENCE</text>
  <text x="740" y="390" fill="#a7f3d0" font-size="10" text-anchor="middle">RAM-only consumption; zero forensic traces upon logout</text>

  <rect x="540" y="440" width="400" height="140" rx="8" fill="#132621" stroke="#10b981"/>
  <text x="560" y="465" fill="#34d399" font-weight="bold" font-size="12">Hardened Guarantees:</text>
  <text x="560" y="490" fill="#a7f3d0" font-size="11">&bull; Complete immunity to cross-user session data leakage</text>
  <text x="560" y="510" fill="#a7f3d0" font-size="11">&bull; E-commerce checkout, banking, and medical data 100% protected</text>
  <text x="560" y="530" fill="#a7f3d0" font-size="11">&bull; Content-hashed static assets accelerated with immutable</text>
  <text x="560" y="550" fill="#a7f3d0" font-size="11">&bull; HTML deployment drift &amp; ChunkLoadError crashes eliminated</text>
</svg>
